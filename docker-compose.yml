
services:
  postgres:
    image: postgres:17
    container_name: pact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact_password
      POSTGRES_DB: pact_broker
    volumes:
      - pact-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    image: pactfoundation/pact-broker:2.137.0-pactbroker2.118.0
    container_name: pact-broker
    restart: unless-stopped
    ports:
      - "9292:9292"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_DATABASE_URL: postgres://pact:pact_password@postgres/pact_broker
      PACT_BROKER_BASE_URL: ${PACT_BROKER_URL:-http://localhost:9292}
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: "5"
      PACT_BROKER_LOG_LEVEL: INFO

volumes:
  pact-postgres-data:
